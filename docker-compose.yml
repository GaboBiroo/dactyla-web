# =============================================================================
# DACTYLA CODE // INFRAESTRUTURA LOCAL-FIRST B2B (RYZEN 5 5600G | 32GB RAM)
# Stack: PostgreSQL 16 + Redis 7 + Evolution API v2 + n8n (Queue Mode) + Cloudflared
# Exposição Zero-Trust sem abrir portas no roteador via Cloudflare Tunnel.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: dactyla_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dactyla}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dactyla_root_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dactyla_core}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/Sao_Paulo
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=200"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - dactyla_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dactyla} -d ${POSTGRES_DB:-dactyla_core}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dactyla_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dactyla_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: dactyla_evolution_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-https://evo.dactylacode.com.br}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dactyla_evo_master_key_2026}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-dactyla}:${POSTGRES_PASSWORD:-dactyla_root_2026}@postgres:5432/evolution?schema=public
      DATABASE_CLIENT_NAME: dactyla_evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution_v2
      CACHE_REDIS_SAVE_INSTANCES: "true"
      DEL_INSTANCE: "false"
      TELEMETRY: "false"
      TZ: America/Sao_Paulo
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - dactyla_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: dactyla_n8n_main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-dactyla}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-dactyla_root_2026}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: 2
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
      NODE_OPTIONS: "--max_old_space_size=2048"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dactyla_n8n_encryption_key_2026}
      N8N_HOST: ${N8N_HOST:-n8n.dactylacode.com.br}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-https://n8n.dactylacode.com.br/}
      NODE_ENV: production
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - dactyla_net

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: dactyla_n8n_worker
    restart: unless-stopped
    command: worker --concurrency=10
    depends_on:
      - n8n
      - postgres
      - redis
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-dactyla}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-dactyla_root_2026}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_DB: 2
      NODE_OPTIONS: "--max_old_space_size=2048"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dactyla_n8n_encryption_key_2026}
      NODE_ENV: production
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - dactyla_net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dactyla_cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TZ: America/Sao_Paulo
    depends_on:
      - n8n
      - evolution-api
    networks:
      - dactyla_net

networks:
  dactyla_net:
    driver: bridge

volumes:
  postgres_data:
    external: false
  redis_data:
    external: false
  evolution_instances:
    external: false
  n8n_data:
    external: false
